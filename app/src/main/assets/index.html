<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Shadow Duel 3D</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050816;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

window.addEventListener("resize",resize);
resize();


/* =========================
   CAMERA
========================= */

const camera = {

    x:0,
    y:120,
    z:-450,

    fov:500

};


/* =========================
   3D PROJECTION
========================= */

function project(x,y,z){

    const dz = z - camera.z;

    if(dz <= 1) return null;

    const scale = camera.fov / dz;

    return {

        x:W/2 + (x-camera.x)*scale,

        y:H/2 - (y-camera.y)*scale,

        scale:scale

    };

}


/* =========================
   SKY
========================= */

function drawSky(){

    const sky =
        ctx.createLinearGradient(
            0,0,
            0,H*0.55
        );

    sky.addColorStop(
        0,
        "#02040d"
    );

    sky.addColorStop(
        1,
        "#12345a"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        W,
        H*0.55
    );

}


/* =========================
   MOON
========================= */

function drawMoon(){

    const x = W*0.75;
    const y = H*0.22;

    const r =
        Math.min(W,H)*0.08;


    const glow =
        ctx.createRadialGradient(
            x,y,r*0.2,
            x,y,r*3
        );

    glow.addColorStop(
        0,
        "#a9eaff99"
    );

    glow.addColorStop(
        1,
        "#2196ff00"
    );

    ctx.fillStyle = glow;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r*3,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#d9f6ff";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================
   GROUND
========================= */

function drawGround(){

    const horizon =
        H*0.50;


    const ground =
        ctx.createLinearGradient(
            0,
            horizon,
            0,
            H
        );

    ground.addColorStop(
        0,
        "#132c4b"
    );

    ground.addColorStop(
        1,
        "#020611"
    );

    ctx.fillStyle =
        ground;

    ctx.fillRect(
        0,
        horizon,
        W,
        H-horizon
    );


    /* perspective grid */

    ctx.strokeStyle =
        "#159dff55";

    ctx.lineWidth = 1;


    for(let i=1;i<14;i++){

        const t=i/14;

        const y =
            horizon +
            Math.pow(t,1.8) *
            (H-horizon);

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();

    }


    /* vertical lines */

    for(
        let i=-12;
        i<=12;
        i++
    ){

        ctx.beginPath();

        ctx.moveTo(
            W/2,
            horizon
        );

        ctx.lineTo(
            W/2 +
            i*W*0.13,
            H
        );

        ctx.stroke();

    }

}


/* =========================
   ARENA
========================= */

function drawArena(){

    const y =
        H*0.58;


    ctx.strokeStyle =
        "#20c8ff";

    ctx.lineWidth = 3;

    ctx.shadowColor =
        "#008cff";

    ctx.shadowBlur = 18;


    ctx.strokeRect(

        W*0.12,
        y,

        W*0.76,
        H*0.29

    );


    ctx.shadowBlur = 0;


    /* center line */

    ctx.strokeStyle =
        "#ff3858";

    ctx.beginPath();

    ctx.moveTo(
        W/2,
        y
    );

    ctx.lineTo(
        W/2,
        H*0.87
    );

    ctx.stroke();

}


/* =========================
   TITLE
========================= */

function drawTitle(){

    ctx.textAlign =
        "center";


    ctx.font =
        "900 " +
        Math.max(
            28,
            W*0.07
        ) +
        "px Arial";


    ctx.shadowColor =
        "#159dff";

    ctx.shadowBlur = 20;


    ctx.fillStyle =
        "#e9f8ff";


    ctx.fillText(

        "SHADOW",

        W/2,
        H*0.12

    );


    ctx.fillStyle =
        "#ff3858";


    ctx.fillText(

        "DUEL",

        W/2,
        H*0.19

    );


    ctx.shadowBlur = 0;

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawSky();

    drawMoon();

    drawGround();

    drawArena();

    drawTitle();


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
  </html>
