<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shadow Duel</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050816;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}
    #joystick{
 position:fixed;
 left:20px;
 bottom:30px;
 width:120px;
 height:120px;
 border:3px solid #21bfff;
 border-radius:50%;
 background:#21bfff22;
 touch-action:none;
}
#stick{
 position:absolute;
 left:35px;
 top:35px;
 width:50px;
 height:50px;
 border-radius:50%;
 background:#21bfff;
    }
</style>
</head>

<body>

<canvas id="game"></canvas>
<div id="joystick">
 <div id="stick"></div>
</div>
    
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let moveX=0;

joystick.addEventListener("pointermove",e=>{
 const r=joystick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 const max=35;

 dx=Math.max(-max,Math.min(max,dx));

 stick.style.left=(35+dx)+"px";
 moveX=dx/max;
});

function resetJoy(){
 stick.style.left="35px";
 moveX=0;
}
rin.x += moveX * 0.003;
rin.x = Math.max(0.18,Math.min(0.48,rin.x));

joystick.addEventListener("pointerup",resetJoy);
joystick.addEventListener("pointercancel",resetJoy);
    
function draw(){

    const W = canvas.width;
    const H = canvas.height;

    ctx.clearRect(0,0,W,H);

    /* Sky */
    const sky = ctx.createLinearGradient(0,0,0,H);

    sky.addColorStop(0,"#02040d");
    sky.addColorStop(0.55,"#12345a");
    sky.addColorStop(1,"#020611");

    ctx.fillStyle = sky;
    ctx.fillRect(0,0,W,H);

    /* Moon */
    ctx.fillStyle = "#d9f6ff";

    ctx.beginPath();
    ctx.arc(
        W*0.78,
        H*0.18,
        Math.min(W,H)*0.07,
        0,
        Math.PI*2
    );
    ctx.fill();

    /* Ground */
    ctx.fillStyle = "#10263f";
    ctx.fillRect(0,H*0.5,W,H*0.5);

    /* Arena */
    ctx.strokeStyle = "#20c8ff";
    ctx.lineWidth = 3;

    ctx.strokeRect(
        W*0.08,
        H*0.57,
        W*0.84,
        H*0.30
    );

    /* Title */
    ctx.textAlign = "center";
    ctx.font = "900 " + Math.max(28,W*0.07) + "px Arial";

    ctx.fillStyle = "#e9f8ff";
    ctx.fillText("SHADOW",W/2,H*0.10);

    ctx.fillStyle = "#ff3158";
    ctx.fillText("DUEL",W/2,H*0.17);

    /* RIN */
    ctx.fillStyle = "#21bfff";
    ctx.fillRect(W*0.30,H*0.55,60,100);

    ctx.fillStyle = "#f0c7a5";
    ctx.beginPath();
    ctx.arc(W*0.33,H*0.51,30,0,Math.PI*2);
    ctx.fill();

    /* VEX */
    ctx.fillStyle = "#ff3158";
    ctx.fillRect(W*0.66,H*0.55,60,100);

    ctx.fillStyle = "#f0c7a5";
    ctx.beginPath();
    ctx.arc(W*0.69,H*0.51,30,0,Math.PI*2);
    ctx.fill();

    requestAnimationFrame(draw);
}
    
draw();
</script>

</body>
</html>
